baseURL = "https://shironghe.github.io/"
locale = "zh"
title = "何世荣的博客"
theme = "PaperMod"
defaultContentLanguage = "zh"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
enableEmoji = true
hasCJKLanguage = true
paginate = 10
summaryLength = 30
timeZone = "Asia/Shanghai"
copyright = "© 2026 shironghe · CC BY-SA 4.0"

[taxonomies]
  tag = "tags"
  category = "categories"
  series = "series"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false

[params]
  env = "production"
  title = "何世荣的博客"
  description = "你好，我是何世荣，目前从事大模型算法相关工作。这个博客用于记录和分享我在工作与学习中的见解。我的兴趣包括 AI Agent，RAG。欢迎交流"
  keywords = ["blog", "hugo", "open source", "shironghe"]
  author = "shironghe"
  mainSections = ["posts"]
  DateFormat = "2006-01-02"
  defaultTheme = "auto"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowWordCount = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  ShowFullTextinRSS = false
  ShowRssButtonInSectionTermList = true
  ShowAllPagesInArchive = true
  comments = true

  [params.assets]
    favicon = "/favicon.svg"
    favicon16x16 = "/favicon.svg"
    favicon32x32 = "/favicon.svg"
    apple_touch_icon = "/favicon.svg"
    safari_pinned_tab = "/favicon.svg"

  [params.homeInfoParams]
    Title = "👋 欢迎访问我的博客"
    Content = "你好，我是何世荣，目前从事大模型算法相关工作。这个博客用于记录和分享我在工作与学习中的见解。我的兴趣包括 AI Agent，RAG。欢迎交流"

  [params.contact]
    github = "https://github.com/shironghe"
    email = "mailto:hsr2025@163.com"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/shironghe"
  [[params.socialIcons]]
    name = "email"
    url = "mailto:hsr2025@163.com"

  [params.giscus]
    repo = "shironghe/shironghe.github.io"
    repoId = "R_kgDOUDorBg"
    category = "Announcements"
    categoryId = "DIC_kwDOUDorBs4DEJhQ"
    mapping = "pathname"
    reactionsEnabled = 1
    inputPosition = "top"
    theme = "preferred_color_scheme"

[languages]
  [languages.zh]
    label = "中文"
    locale = "zh"
    weight = 1
    title = "何世荣的博客"
    contentDir = "content/zh"

    [languages.zh.params]
      description = "shironghe 的开源技术博客：用 Hugo 构建，中英双语记录工程实践。"

      [[languages.zh.menu.main]]
        identifier = "archives"
        name = "归档"
        url = "/archives/"
        weight = 10
      [[languages.zh.menu.main]]
        identifier = "search"
        name = "搜索"
        url = "/search/"
        weight = 20
      [[languages.zh.menu.main]]
        identifier = "tags"
        name = "标签"
        url = "/tags/"
        weight = 30

  [languages.en]
    label = "English"
    locale = "en"
    weight = 2
    title = "shironghe's Blog"
    contentDir = "content/en"

    [languages.en.params]
      description = "shironghe's open-source tech blog: built with Hugo, written in Chinese with English translations."

      [languages.en.params.homeInfoParams]
        Title = "👋 Welcome to My Blog"
        Content = "Hi, I'm He Shirong, currently working on large language model algorithms. This blog documents and shares insights from my work and learning. My interests include AI agents and RAG. Feel free to reach out."

      [[languages.en.menu.main]]
        identifier = "archives"
        name = "Archives"
        url = "/en/archives/"
        weight = 10
      [[languages.en.menu.main]]
        identifier = "search"
        name = "Search"
        url = "/en/search/"
        weight = 20
      [[languages.en.menu.main]]
        identifier = "tags"
        name = "Tags"
        url = "/en/tags/"
        weight = 30
